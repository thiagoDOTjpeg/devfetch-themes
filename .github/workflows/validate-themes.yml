name: Validate themes

on:
  pull_request:
    paths:
      - "themes/*.json"
      - "schema.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate themes against schema
        run: npm run validate
